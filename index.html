<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>景美浸信會2026暑期愛在63村《信心Go Shoot!》+親子出遊 報名系統</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 載入 Babel 進行 JSX 編譯 -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 載入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- 設定常數 ---
        const PRICING = { camp: 700, outing: { A: 700, B: 800, C: 1000, D: 1100, E: 0 } };
        const NeedsDIYChoice = (val) => val === 'B' || val === 'D';
        const ALL_CAMP_DAYS = ['7/15 (三)', '7/16 (四)', '7/17 (五)'];

        const TSHIRT_SIZES = [
            { value: '小L(XXS)', label: '小L (XXS) - 建議身高 130~140cm', surcharge: 0 },
            { value: '小XL(XS)', label: '小XL (XS) - 建議身高 140~155cm', surcharge: 0 },
            { value: 'S', label: 'S - 建議身高 145~155cm (男/女皆可)', surcharge: 0 },
            { value: 'M', label: 'M - 建議身高 155~165cm (男/女皆可)', surcharge: 0 },
            { value: 'L', label: 'L - 建議身高 165~175cm (男生尺寸)', surcharge: 0 },
            { value: 'XL', label: 'XL - 建議身高 175~185cm (男生尺寸)', surcharge: 0 },
            { value: '2XL', label: '2XL - 建議身高 183cm 以上 (男生尺寸)', surcharge: 0 },
            { value: '3XL', label: '3XL - 特大 (需加價 $50)', surcharge: 50 },
            { value: '4XL', label: '4XL - 特大 (需加價 $100)', surcharge: 100 }
        ];

        const OUTING_OPTIONS = [
            { value: 'A', label: '方案 A：【不打水彈、不手作】 - $700 (當日發$150抵用券)', price: 700 },
            { value: 'B', label: '方案 B：【不打水彈、含下午手作】 - $800 (當日發$100抵用券)', price: 800 },
            { value: 'C', label: '方案 C：【含上午水彈、不手作】 - $1000 (當日發$150抵用券)', price: 1000 },
            { value: 'D', label: '方案 D：【含水彈、含手作】 - $1100 (當日發$100抵用券)', price: 1100 },
            { value: 'E', label: '不參加親子出遊', price: 0 }
        ];
        const ADULT_OUTING_OPTIONS_REQUIRED = OUTING_OPTIONS.filter(opt => opt.value !== 'E');

        // --- 共用元件 ---
        const Icon = ({ name, className }) => <i data-lucide={name} className={className}></i>;

        const DIYSelection = ({ value, onChange, extraClass = "" }) => {
            const PUFF_IMG = "https://docs.google.com/drawings/d/e/2PACX-1vTp6s0-oT0cLX5M5ulqiN2IlXAqvcgTa1jkpNrAIJzinWsRkeokORYJTNhFytEX65O89IwzpqK70qKc/pub?w=547&h=717";
            const DONUT_IMG = "https://docs.google.com/drawings/d/e/2PACX-1vTdvzKSG_r-slZeGxE9bVhGcuvIRXtf7O9Lz3VeaPNYrLTd4hcxyMmGmWk8J7W3_5QofigAreBoSA0X/pub?w=724&h=718";

            return (
                <div className={`pl-4 border-l-4 border-yellow-400 py-2 mt-3 relative ${extraClass}`}>
                    <label className="block text-sm font-bold text-yellow-800 mb-2">手作項目選擇 (請點擊下方圖片) <span className="text-red-500">*</span></label>
                    <input type="text" required value={value} readOnly className="absolute opacity-0 w-0 h-0 pointer-events-none" tabIndex={-1} />
                    <div className="grid grid-cols-2 gap-3">
                        {['A', 'B'].map((type) => (
                            <div key={type} onClick={() => onChange(type)} className={`cursor-pointer rounded-lg border-2 p-2 flex flex-col items-center gap-2 transition-all ${value === type ? 'border-yellow-500 bg-yellow-50 shadow-md transform scale-[1.02]' : 'border-gray-200 hover:border-yellow-300 bg-white'}`}>
                                <div className="w-full aspect-[4/3] rounded-md overflow-hidden bg-gray-100 flex items-center justify-center">
                                    <img src={type === 'A' ? PUFF_IMG : DONUT_IMG} alt={type === 'A' ? "泡芙" : "甜甜圈"} className="w-full h-full object-cover bg-white" />
                                </div>
                                <span className={`font-bold text-sm text-center ${value === type ? 'text-yellow-700' : 'text-gray-600'}`}>
                                    手作 {type} ({type === 'A' ? '小熊泡芙' : '彩色甜甜圈'})
                                </span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const InsuranceBlock = ({ theme, birthDate, idNumber, onChangeBirth, onChangeId, extraClass = "" }) => {
            const colors = {
                blue: { border: 'border-blue-200', text: 'text-blue-800', icon: 'text-blue-600', ring: 'focus:ring-blue-500' },
                green: { border: 'border-green-200', text: 'text-green-800', icon: 'text-green-600', ring: 'focus:ring-green-500' },
                purple: { border: 'border-purple-200', text: 'text-purple-800', icon: 'text-purple-600', ring: 'focus:ring-purple-500' }
            }[theme];

            return (
                <div className={`p-3 bg-white/60 rounded-lg border ${colors.border} mt-2 ${extraClass}`}>
                    <p className={`text-sm font-bold ${colors.text} flex items-center gap-1 mb-2`}>
                        <Icon name="shield-check" className={`w-4 h-4 mr-1 ${colors.icon}`} /> 出遊保險所需資料 <span className="text-red-500">*</span>
                    </p>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label className="block text-xs font-medium text-gray-700 mb-1">出生年月日</label>
                            <input required type="date" value={birthDate} onChange={e => onChangeBirth(e.target.value)} className={`w-full p-2 text-sm border rounded-md outline-none focus:ring-2 ${colors.ring}`} />
                        </div>
                        <div>
                            <label className="block text-xs font-medium text-gray-700 mb-1">身分證字號</label>
                            <input required type="text" value={idNumber} onChange={e => onChangeId(e.target.value)} placeholder="例如：A123456789" className={`w-full p-2 text-sm border rounded-md outline-none focus:ring-2 ${colors.ring} uppercase`} />
                        </div>
                    </div>
                </div>
            );
        };

        // --- 主程式 App ---
        function App() {
            // 💡 聯絡人預設為不參加出遊 (outing: 'E')
            const [contact, setContact] = useState({ name: '', phone: '', email: '', type: '一般家庭', tshirtSize: '', outing: 'E', diy: '', birthDate: '', idNumber: '' });
            const [children, setChildren] = useState([{ id: Date.now(), name: '', campDays: [], outing: 'E', diy: '', tshirtSize: '', birthDate: '', idNumber: '' }]);
            const [adults, setAdults] = useState([]);
            const [submitStatus, setSubmitStatus] = useState('idle');

            // 觸發 Lucide 圖示渲染
            useEffect(() => {
                lucide.createIcons();
            });

            const handleAddChild = () => { if (children.length < 3) setChildren(prev => [...prev, { id: Date.now(), name: '', campDays: [], outing: 'E', diy: '', tshirtSize: '', birthDate: '', idNumber: '' }]); };
            const handleRemoveChild = (id) => setChildren(prev => prev.filter(c => c.id !== id));

            const handleAddAdult = () => { if (adults.length < 3) setAdults(prev => [...prev, { id: Date.now(), name: '', outing: 'A', diy: '', birthDate: '', idNumber: '' }]); };
            const handleRemoveAdult = (id) => setAdults(prev => prev.filter(a => a.id !== id));

            const updateChild = (id, updates) => setChildren(prev => prev.map(c => c.id === id ? { ...c, ...updates } : c));
            const updateAdult = (id, updates) => setAdults(prev => prev.map(a => a.id === id ? { ...a, ...updates } : a));

            const totalAmount = useMemo(() => {
                let total = 0;
                if (contact.outing !== 'E') total += PRICING.outing[contact.outing] || 0;
                if (contact.type === '一般家庭') {
                    children.forEach(c => {
                        if (c.campDays.length > 0) {
                            total += PRICING.camp;
                            const sizeObj = TSHIRT_SIZES.find(s => s.value === c.tshirtSize);
                            if (sizeObj) total += sizeObj.surcharge;
                        }
                        if (c.outing !== 'E') total += PRICING.outing[c.outing] || 0;
                    });
                }
                adults.forEach(a => { if (a.outing !== 'E') total += PRICING.outing[a.outing] || 0; });
                return total;
            }, [children, adults, contact]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setSubmitStatus('loading');

                // 🌟 使用您專屬的 Google Apps Script 網址
                const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzJSTok-mrRbdYZhok2f6AiUhvKW1K231_poeFmDhm1jhpHj-ciltmEn3OrOV5ZnY6t/exec';

                if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes('YOUR_')) {
                    alert('【系統提示】請先在程式碼中填入您的 Google Apps Script 網址！');
                    setSubmitStatus('idle');
                    return;
                }

                let counts = { camp: 0, A: 0, B: 0, C: 0, D: 0, diyA: 0, diyB: 0 };
                const tally = (outing, diy, campDays) => {
                    if (campDays && campDays.length > 0) counts.camp++;
                    if (['A', 'B', 'C', 'D'].includes(outing)) counts[outing]++;
                    if (['B', 'D'].includes(outing)) {
                        if (diy === 'A') counts.diyA++;
                        if (diy === 'B') counts.diyB++;
                    }
                };
                tally(contact.outing, contact.diy, null);
                if (contact.type === '一般家庭') children.forEach(c => tally(c.outing, c.diy, c.campDays));
                adults.forEach(a => tally(a.outing, a.diy, null));

                const getC = (idx, field) => {
                    if (contact.type !== '一般家庭') return '';
                    if (!children[idx]) return '';
                    if (field === 'campDays') return children[idx].campDays.length > 0 ? children[idx].campDays.sort().join('、') : '不參加';
                    return children[idx][field] || '';
                };
                const getA = (idx, field) => adults[idx] ? (adults[idx][field] || '') : '';

                const flatValues = [
                    new Date().toLocaleString(), totalAmount, counts.camp, counts.A, counts.B, counts.C, counts.D, counts.diyA, counts.diyB,
                    contact.name, contact.phone, contact.email, contact.type, contact.type === '教會同工' ? contact.tshirtSize : '', contact.outing, contact.diy, contact.birthDate, contact.idNumber,
                    getC(0, 'name'), getC(0, 'campDays'), getC(0, 'tshirtSize'), getC(0, 'outing'), getC(0, 'diy'), getC(0, 'birthDate'), getC(0, 'idNumber'),
                    getC(1, 'name'), getC(1, 'campDays'), getC(1, 'tshirtSize'), getC(1, 'outing'), getC(1, 'diy'), getC(1, 'birthDate'), getC(1, 'idNumber'),
                    getC(2, 'name'), getC(2, 'campDays'), getC(2, 'tshirtSize'), getC(2, 'outing'), getC(2, 'diy'), getC(2, 'birthDate'), getC(2, 'idNumber'),
                    getA(0, 'name'), getA(0, 'outing'), getA(0, 'diy'), getA(0, 'birthDate'), getA(0, 'idNumber'),
                    getA(1, 'name'), getA(1, 'outing'), getA(1, 'diy'), getA(1, 'birthDate'), getA(1, 'idNumber'),
                    getA(2, 'name'), getA(2, 'outing'), getA(2, 'diy'), getA(2, 'birthDate'), getA(2, 'idNumber')
                ];

                const payload = {
                    values: flatValues,
                    emailData: { email: contact.email, name: contact.name, totalAmount: totalAmount }
                };

                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    setSubmitStatus('success');
                } catch (error) {
                    console.error('傳輸錯誤:', error);
                    setSubmitStatus('error');
                }
            };

            if (submitStatus === 'success') {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-xl shadow-lg max-w-md w-full text-center">
                            <Icon name="check-circle" className="w-16 h-16 text-green-500 mx-auto mb-4" />
                            <h2 className="text-2xl font-bold text-gray-800 mb-2">報名成功！</h2>
                            <p className="text-gray-600 mb-2">感謝您的報名，我們已將報名資訊寄至：<br /><span className="font-semibold text-gray-800">{contact.email}</span></p>
                            <p className="text-gray-600 mb-6">請協助繳交費用總計 <span className="font-bold text-xl text-blue-600">${totalAmount}</span> 元。</p>
                            <button onClick={() => window.location.reload()} className="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">返回重新填寫</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-100 py-8 px-4 font-sans text-gray-800">
                    <div className="max-w-3xl mx-auto space-y-6">

                        {/* Header & 活動詳情 */}
                        <div className="bg-white rounded-xl shadow-sm overflow-hidden border-t-4 border-blue-600">
                            <div className="p-6 pb-2">
                                <h1 className="text-2xl sm:text-3xl font-bold text-blue-900 mb-2">《信心Go Shoot!》+ 親子出遊 報名系統</h1>
                                <p className="text-gray-600 text-sm mb-4">景美浸信會 2026暑期愛在63村</p>
                            </div>
                            
                            {/* 💡 新增的活動詳情區塊 */}
                            <div className="px-6 mb-4 space-y-4">
                                <div className="bg-blue-50/70 p-4 rounded-lg border border-blue-100">
                                    <h3 className="font-bold text-blue-800 text-lg mb-2 flex items-center gap-2">
                                        <Icon name="tent" className="w-5 h-5" /> 《信心Go Shoot!》兒童營會
                                    </h3>
                                    <ul className="space-y-1 text-sm text-gray-700">
                                        <li><strong>營會對象：</strong>2026年一至六年級學生</li>
                                        <li><strong>營會時間：</strong>2026年7月15日至17日（星期三至五）09:00-16:45</li>
                                        <li><strong>營會地點：</strong>中華基督教景美浸信會B1副堂（臺北市文山區育英街63號）</li>
                                        <li><strong>營會內容：</strong>遊戲、詩歌、聖經故事、團體活動與體驗</li>
                                        <li><strong>攜帶物品：</strong>餐具、水壺、鉛筆盒</li>
                                        <li className="mt-2 text-rose-600 font-semibold">P.S. 報名參與營會者，可獲得營會T-Shirt一件！</li>
                                    </ul>
                                </div>

                                <div className="bg-green-50/70 p-4 rounded-lg border border-green-100">
                                    <h3 className="font-bold text-green-800 text-lg mb-2 flex items-center gap-2">
                                        <Icon name="map" className="w-5 h-5" /> 《親子出遊》
                                    </h3>
                                    <ul className="space-y-1 text-sm text-gray-700">
                                        <li><strong>出遊時間：</strong>2026年7月18日（星期六）08:00-16:30</li>
                                        <li><strong>集合地點：</strong>景美浸信會2F大堂</li>
                                        <li><strong>出遊地點：</strong>亞太漆彈區+77巧克力共和國</li>
                                        <li><strong>活動內容：</strong>親子水彈對戰（可自由參加）、團體活動、手作DIY</li>
                                        <li className="pt-1">
                                            <strong>水彈活動說明：</strong>水彈遊戲非水球或水槍對戰，對戰過程不會弄濕身體，不須自己帶水槍或其他設備，所有的防護設備、水彈槍與水彈（類似水晶寶寶的球體，打到身體不會痛）都會由廠商提供。
                                        </li>
                                        <li><strong>攜帶物品：</strong>防曬物品、水壺、雨具、驅蚊與個人藥品</li>
                                    </ul>
                                </div>

                                <div className="bg-yellow-50/70 p-4 rounded-lg border border-yellow-100 flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between text-sm text-gray-800">
                                    <div className="flex items-center gap-2">
                                        <Icon name="clock" className="w-5 h-5 text-yellow-600" />
                                        <span>活動報名截止日期：<strong>06/30（二）</strong></span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <Icon name="phone" className="w-5 h-5 text-yellow-600" />
                                        <span>疑問請洽：<strong>曾傳道 0912468909</strong></span>
                                    </div>
                                </div>
                            </div>

                            <div className="p-6 pt-0">
                                <div className="bg-gray-100 text-gray-700 p-4 rounded-lg flex items-start gap-3 text-sm">
                                    <Icon name="info" className="w-5 h-5 shrink-0 mt-0.5 text-gray-500" />
                                    <div>
                                        <p className="font-semibold mb-1">表單填寫須知：</p>
                                        <ul className="list-disc pl-4 space-y-1">
                                            <li>本表單可自動試算費用。每單最多報名 <strong>3位孩童</strong> 及 <strong>4位大人 (含主要聯絡人)</strong>。</li>
                                            <li><strong>營會收費說明：</strong>兒童營會費統一為 <strong>$700 (贈T-Shirt)</strong>，請確實勾選出席日期。</li>
                                            <li>為了辦理旅遊平安險，有參與出遊者請務必填寫出生年月日及身分證字號。</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-6 pb-24">

                            {/* Section 1: Contact Info */}
                            <div className="bg-white rounded-xl shadow-sm p-6">
                                <h2 className="text-xl font-bold border-b pb-2 mb-4 flex items-center gap-2">
                                    <Icon name="user" className="w-5 h-5 text-blue-600 mr-1" /> 主要聯絡人資訊 (第 1 位大人)
                                </h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">姓名 *</label>
                                        <input required type="text" value={contact.name} onChange={e => setContact(p => ({ ...p, name: e.target.value }))} className="w-full p-2 border rounded-md outline-none focus:ring-2 focus:ring-blue-500" placeholder="例如：王小明家長" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">聯絡電話 *</label>
                                        <input required type="tel" value={contact.phone} onChange={e => setContact(p => ({ ...p, phone: e.target.value }))} className="w-full p-2 border rounded-md outline-none focus:ring-2 focus:ring-blue-500" placeholder="0912-345-678" />
                                    </div>
                                    <div className="md:col-span-2">
                                        <label className="block text-sm font-medium text-gray-700 mb-1 flex items-center gap-1">
                                            <Icon name="mail" className="w-4 h-4 mr-1" /> 電子信箱 (Email) *
                                        </label>
                                        <input required type="email" value={contact.email} onChange={e => setContact(p => ({ ...p, email: e.target.value }))} className="w-full p-2 border rounded-md outline-none focus:ring-2 focus:ring-blue-500" placeholder="系統將自動寄送「報名成功與金額明細」至此信箱" />
                                    </div>
                                    <div className="md:col-span-2">
                                        <label className="block text-sm font-medium text-gray-700 mb-1">身分區別 *</label>
                                        <select
                                            value={contact.type}
                                            onChange={e => {
                                                setContact(p => ({ ...p, type: e.target.value, tshirtSize: '', outing: 'E', diy: '', birthDate: '', idNumber: '' }));
                                            }}
                                            className="w-full p-2 border rounded-md bg-white outline-none focus:ring-2 focus:ring-blue-500"
                                        >
                                            <option value="一般家庭">一般家庭</option>
                                            <option value="教會同工">教會同工</option>
                                        </select>
                                    </div>

                                    {/* 聯絡人專屬：衣服與出遊保險區塊 */}
                                    <div className="md:col-span-2 space-y-4 mt-2 p-4 bg-blue-50 rounded-lg border border-blue-200">
                                        {contact.type === '教會同工' && (
                                            <>
                                                <div className="flex items-start gap-3">
                                                    <Icon name="shirt" className="w-5 h-5 text-blue-600 mt-0.5 shrink-0" />
                                                    <div className="w-full">
                                                        <label className="block text-sm font-bold text-blue-800 mb-1">同工營會 T-Shirt 尺寸 <span className="text-red-500">*</span></label>
                                                        <select required value={contact.tshirtSize} onChange={e => setContact(p => ({ ...p, tshirtSize: e.target.value }))} className="w-full p-2 border rounded-md bg-white border-blue-200 focus:ring-2 focus:ring-blue-500 outline-none">
                                                            <option value="" disabled>請選擇您的尺寸...</option>
                                                            {TSHIRT_SIZES.map(size => <option key={size.value} value={size.value}>{size.label}</option>)}
                                                        </select>
                                                    </div>
                                                </div>
                                                <div className="border-t border-blue-200 my-2"></div>
                                            </>
                                        )}

                                        <div className="flex items-start gap-3">
                                            <Icon name="map" className="w-5 h-5 text-blue-600 mt-0.5 shrink-0" />
                                            <div className="w-full">
                                                <label className="block text-sm font-bold text-blue-800 mb-1">主要聯絡人 7/18 親子出遊方案 <span className="text-red-500">*</span></label>
                                                <select
                                                    value={contact.outing}
                                                    onChange={e => {
                                                        const val = e.target.value;
                                                        setContact(p => ({ ...p, outing: val, diy: NeedsDIYChoice(val) ? p.diy : '', birthDate: val === 'E' ? '' : p.birthDate, idNumber: val === 'E' ? '' : p.idNumber }));
                                                    }}
                                                    className="w-full p-2 border rounded-md bg-white border-blue-200 focus:ring-2 focus:ring-blue-500 outline-none"
                                                >
                                                    {OUTING_OPTIONS.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                                </select>
                                            </div>
                                        </div>

                                        {NeedsDIYChoice(contact.outing) && (
                                            <DIYSelection value={contact.diy} onChange={val => setContact(p => ({ ...p, diy: val }))} extraClass="md:ml-8" />
                                        )}

                                        {contact.outing !== 'E' && (
                                            <InsuranceBlock theme="blue" birthDate={contact.birthDate} idNumber={contact.idNumber} onChangeBirth={v => setContact(p => ({ ...p, birthDate: v }))} onChangeId={v => setContact(p => ({ ...p, idNumber: v }))} extraClass="md:ml-8" />
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Section 2: Children */}
                            {contact.type === '一般家庭' && (
                                <div className="bg-white rounded-xl shadow-sm p-6 transition-all duration-300">
                                    <div className="flex justify-between items-center border-b pb-2 mb-4">
                                        <h2 className="text-xl font-bold flex items-center gap-2">
                                            <Icon name="users" className="w-5 h-5 text-green-600 mr-1" /> 孩童專區 <span className="text-sm font-normal text-gray-500">(最多 3 位)</span>
                                        </h2>
                                    </div>

                                    <div className="space-y-6">
                                        {children.map((child, index) => (
                                            <div key={child.id} className="p-4 bg-green-50 rounded-lg border border-green-200 relative">
                                                <div className="flex justify-between items-center mb-3">
                                                    <h3 className="font-bold text-green-800">第 {index + 1} 位孩童</h3>
                                                    {children.length > 1 && (
                                                        <button type="button" onClick={() => handleRemoveChild(child.id)} className="text-red-500 hover:text-red-700 text-sm flex items-center gap-1">
                                                            <Icon name="trash-2" className="w-4 h-4 mr-1" /> 刪除
                                                        </button>
                                                    )}
                                                </div>

                                                <div className="space-y-5">
                                                    <div>
                                                        <label className="block text-sm font-medium text-gray-700 mb-1">孩童姓名 *</label>
                                                        <input required type="text" value={child.name} onChange={e => updateChild(child.id, { name: e.target.value })} className="w-full p-2 border rounded-md focus:ring-2 focus:ring-green-500 outline-none border-green-200" />
                                                    </div>

                                                    <div className="bg-white p-3 rounded-md border border-green-200">
                                                        <label className="block text-sm font-bold text-green-800 mb-2 flex items-center gap-1">
                                                            <Icon name="calendar-check" className="w-4 h-4 mr-1" /> 營會出席日期 (請勾選)
                                                        </label>
                                                        <p className="text-xs text-gray-500 mb-3">只要勾選任一日，營會費用即為統一價 $700，若都不勾選視為不參加。</p>
                                                        <div className="flex flex-col sm:flex-row gap-3 sm:gap-6">
                                                            {ALL_CAMP_DAYS.map(day => (
                                                                <label key={day} className="flex items-center gap-2 cursor-pointer hover:bg-green-50 p-1 rounded transition-colors">
                                                                    <input type="checkbox" checked={child.campDays.includes(day)} onChange={e => {
                                                                        const newDays = e.target.checked ? [...child.campDays, day] : child.campDays.filter(d => d !== day);
                                                                        updateChild(child.id, { campDays: newDays, tshirtSize: newDays.length === 0 ? '' : child.tshirtSize });
                                                                    }} className="w-5 h-5 text-green-600 border-gray-300 rounded focus:ring-green-500 cursor-pointer" />
                                                                    <span className="text-sm font-medium text-gray-700">{day}</span>
                                                                </label>
                                                            ))}
                                                        </div>
                                                    </div>

                                                    {child.campDays.length > 0 && (
                                                        <div className="pl-4 border-l-4 border-green-400 py-1">
                                                            <label className="block text-sm font-bold text-green-800 flex items-center gap-1 mb-1">
                                                                <Icon name="shirt" className="w-4 h-4 mr-1" /> 營會 T-Shirt 尺寸 *
                                                            </label>
                                                            <select required value={child.tshirtSize} onChange={e => updateChild(child.id, { tshirtSize: e.target.value })} className="w-full p-2 border rounded-md bg-white border-green-200 focus:ring-2 focus:ring-green-500 outline-none">
                                                                <option value="" disabled>請參考建議身高選擇尺寸...</option>
                                                                {TSHIRT_SIZES.map(size => <option key={size.value} value={size.value}>{size.label}</option>)}
                                                            </select>
                                                        </div>
                                                    )}

                                                    <div className="pt-2 border-t border-green-200">
                                                        <label className="block text-sm font-medium text-gray-700 mb-1">7/18 親子出遊方案 *</label>
                                                        <select value={child.outing} onChange={e => {
                                                            const val = e.target.value;
                                                            updateChild(child.id, { outing: val, diy: NeedsDIYChoice(val) ? child.diy : '', birthDate: val === 'E' ? '' : child.birthDate, idNumber: val === 'E' ? '' : child.idNumber });
                                                        }} className="w-full p-2 border rounded-md bg-white focus:ring-2 focus:ring-green-500 outline-none border-green-200">
                                                            {OUTING_OPTIONS.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                                        </select>
                                                    </div>

                                                    {NeedsDIYChoice(child.outing) && (
                                                        <DIYSelection value={child.diy} onChange={val => updateChild(child.id, { diy: val })} />
                                                    )}

                                                    {child.outing !== 'E' && (
                                                        <InsuranceBlock theme="green" birthDate={child.birthDate} idNumber={child.idNumber} onChangeBirth={v => updateChild(child.id, { birthDate: v })} onChangeId={v => updateChild(child.id, { idNumber: v })} />
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    {children.length < 3 && (
                                        <button type="button" onClick={handleAddChild} className="mt-4 w-full py-3 border-2 border-dashed border-green-300 text-green-600 font-semibold rounded-lg hover:bg-green-50 flex justify-center items-center gap-2 transition">
                                            <Icon name="plus-circle" className="w-5 h-5 mr-1" /> 新增下一位孩童
                                        </button>
                                    )}
                                </div>
                            )}

                            {/* Section 3: Adults */}
                            <div className="bg-white rounded-xl shadow-sm p-6">
                                <div className="flex justify-between items-center border-b pb-2 mb-4">
                                    <h2 className="text-xl font-bold flex items-center gap-2">
                                        <Icon name="user" className="w-5 h-5 text-purple-600 mr-1" /> 其他同行親友/家人出遊 <span className="text-sm font-normal text-gray-500">(最多可再加 3 位)</span>
                                    </h2>
                                </div>

                                {adults.length === 0 ? (
                                    <p className="text-gray-500 text-center py-4 text-sm">若無其他親友，請直接送出表單。</p>
                                ) : (
                                    <div className="space-y-6">
                                        {adults.map((adult, index) => (
                                            <div key={adult.id} className="p-4 bg-purple-50 rounded-lg border border-purple-200 relative">
                                                <div className="flex justify-between items-center mb-3">
                                                    <h3 className="font-bold text-purple-800">其他同行親友 {index + 1}</h3>
                                                    <button type="button" onClick={() => handleRemoveAdult(adult.id)} className="text-red-500 hover:text-red-700 text-sm flex items-center gap-1">
                                                        <Icon name="trash-2" className="w-4 h-4 mr-1" /> 刪除
                                                    </button>
                                                </div>

                                                <div className="space-y-4">
                                                    <div>
                                                        <label className="block text-sm font-medium text-gray-700 mb-1">親友姓名 *</label>
                                                        <input required type="text" value={adult.name} onChange={e => updateAdult(adult.id, { name: e.target.value })} className="w-full p-2 border rounded-md focus:ring-2 focus:ring-purple-500 outline-none border-purple-200" />
                                                    </div>

                                                    <div>
                                                        <label className="block text-sm font-medium text-gray-700 mb-1">7/18 親子出遊方案 *</label>
                                                        <select value={adult.outing} onChange={e => {
                                                            const val = e.target.value;
                                                            updateAdult(adult.id, { outing: val, diy: NeedsDIYChoice(val) ? adult.diy : '', birthDate: val === 'E' ? '' : adult.birthDate, idNumber: val === 'E' ? '' : adult.idNumber });
                                                        }} className="w-full p-2 border rounded-md bg-white focus:ring-2 focus:ring-purple-500 outline-none border-purple-200">
                                                            {ADULT_OUTING_OPTIONS_REQUIRED.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                                        </select>
                                                    </div>

                                                    {NeedsDIYChoice(adult.outing) && (
                                                        <DIYSelection value={adult.diy} onChange={val => updateAdult(adult.id, { diy: val })} />
                                                    )}

                                                    {adult.outing !== 'E' && (
                                                        <InsuranceBlock theme="purple" birthDate={adult.birthDate} idNumber={adult.idNumber} onChangeBirth={v => updateAdult(adult.id, { birthDate: v })} onChangeId={v => updateAdult(adult.id, { idNumber: v })} />
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {adults.length < 3 && (
                                    <button type="button" onClick={handleAddAdult} className="mt-4 w-full py-3 border-2 border-dashed border-purple-300 text-purple-600 font-semibold rounded-lg hover:bg-purple-50 flex justify-center items-center gap-2 transition">
                                        <Icon name="plus-circle" className="w-5 h-5 mr-1" /> 新增其他同行親友
                                    </button>
                                )}
                            </div>

                            {submitStatus === 'error' && (
                                <div className="bg-red-50 text-red-700 p-4 rounded-lg flex items-center gap-3">
                                    <Icon name="alert-circle" className="w-5 h-5 shrink-0 mr-1" />
                                    <p>資料傳送失敗，請確認網路連線或稍後再試。</p>
                                </div>
                            )}

                            {/* Sticky Footer */}
                            <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10">
                                <div className="max-w-3xl mx-auto flex items-center justify-between">
                                    <div>
                                        <p className="text-sm text-gray-500 flex items-center gap-1"><Icon name="calculator" className="w-4 h-4 mr-1" /> 系統自動試算</p>
                                        <p className="text-2xl font-bold text-blue-600">NT$ {totalAmount}</p>
                                    </div>
                                    <button type="submit" disabled={submitStatus === 'loading'} className="bg-blue-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-blue-700 transition flex items-center gap-2 disabled:bg-blue-300 shadow-sm">
                                        {submitStatus === 'loading' ? '處理中...' : '確認送出'} <Icon name="send" className="w-5 h-5 ml-1" />
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
